<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YatraLocal Itinerary Engine Unit Tests</title>
  <style>
    body { font-family: monospace; padding: 24px; background: #1e293b; color: #f8fafc; }
    .pass { color: #4ade80; font-weight: bold; }
    .fail { color: #f87171; font-weight: bold; }
    .test-box { background: #0f172a; padding: 16px; border-radius: 8px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <h1>🧪 YatraLocal Itinerary Generator Test Suite</h1>
  <p>Running plain browser assertions against /js/itinerary.js...</p>
  <div id="results"></div>

  <script type="module">
    import { generateItinerary, fetchDestinations } from '/js/itinerary.js';
    import { getSeason, getSeasonBadgeConfig, render12MonthDemandBar } from '/js/season.js';
    import { store } from '/js/store.js';
    import { searchPlacesIndia, getCuratedDestinations, getPlaceByKey } from '/js/places.js';
    import { interpretWeatherCode, render7DayForecastGrid } from '/js/api.js';

    const resultsEl = document.getElementById('results');

    function assert(name, condition, details = '') {
      const div = document.createElement('div');
      div.className = 'test-box';
      if (condition) {
        div.innerHTML = `<span class="pass">✓ PASS:</span> ${name} ${details ? `<br><small style="color:#94a3b8;">${details}</small>` : ''}`;
        console.log(`%c✓ PASS: ${name}`, 'color: #4ade80; font-weight: bold;', details);
      } else {
        div.innerHTML = `<span class="fail">✗ FAIL:</span> ${name} ${details ? `<br><small style="color:#f87171;">${details}</small>` : ''}`;
        console.error(`✗ FAIL: ${name}`, details);
      }
      resultsEl.appendChild(div);
    }

    async function runTests() {
      const destinations = await fetchDestinations();
      assert('Destinations loaded successfully', destinations.length >= 6, `Loaded ${destinations.length} destinations`);

      // Test 1: Senior Mode Limits
      const seniorPrefs = {
        destination: 'manali',
        budget: 15000,
        days: 3,
        travellers: 1,
        moods: ['Relaxed'],
        accessibility: { seniorFriendly: true, minimalWalking: true }
      };
      const seniorPlan = generateItinerary(seniorPrefs, destinations);
      const allSeniorDaysValid = seniorPlan.days.every(d => d.activities.length === 1 && d.activities[0].seniorFriendly);
      assert(
        'Senior Mode Pace: Exactly 1 activity per day and 100% seniorFriendly',
        allSeniorDaysValid,
        `Days verified: ${seniorPlan.days.length}, activities per day: ${seniorPlan.days[0].activities.length}`
      );

      // Test 2: Budget Respected Status
      const highBudgetPrefs = {
        destination: 'jaipur',
        budget: 50000,
        days: 3,
        travellers: 2,
        moods: ['Cultural'],
        accessibility: {}
      };
      const highPlan = generateItinerary(highBudgetPrefs, destinations);
      assert(
        'Budget respected calculation: within_budget flag correct',
        highPlan.budgetStatus === 'within_budget' && highPlan.totalCost <= 50000,
        `Total: ₹${highPlan.totalCost} <= Budget: ₹50,000`
      );

      // Test 3: Mood Matching
      const spiritualPrefs = {
        destination: 'varanasi',
        budget: 12000,
        days: 2,
        travellers: 1,
        moods: ['Spiritual/Pilgrimage'],
        accessibility: {}
      };
      const spiritualPlan = generateItinerary(spiritualPrefs, destinations);
      const hasSpiritual = spiritualPlan.days.some(d => d.activities.some(a => a.category.includes('Spiritual/Pilgrimage')));
      assert(
        'Mood Matching: Prioritizes matching Spiritual/Pilgrimage activities',
        hasSpiritual,
        `Found matching spiritual activities in ${spiritualPlan.destination.name}`
      );

      // Test 4: 1-Day Trip Edge Case
      const oneDayPrefs = {
        destination: 'hampi',
        budget: 4000,
        days: 1,
        travellers: 1,
        moods: ['Cultural'],
        accessibility: {}
      };
      const oneDayPlan = generateItinerary(oneDayPrefs, destinations);
      assert(
        '1-Day Trip Handling: Generates exactly 1 day with up to 3 activities',
        oneDayPlan.days.length === 1 && oneDayPlan.days[0].activities.length <= 3,
        `Day 1 activities count: ${oneDayPlan.days[0].activities.length}`
      );

      // Test 5: Local Tip Inclusion
      const hasLocalTips = seniorPlan.days.every(d => typeof d.localTip === 'string' && d.localTip.length > 10);
      assert(
        'Local Tips Rule: Every day contains a local community tip',
        hasLocalTips,
        `Sample tip: "${seniorPlan.days[0].localTip}"`
      );

      // Test 6: Phase 16 - Season Engine On-Season
      const manaliJan = await getSeason('manali', 1);
      assert(
        'Phase 16 Season Engine: Manali in Jan is On-Season (high demand)',
        manaliJan.level === 'high' && manaliJan.isOnSeason === true && manaliJan.alternatives.length > 0,
        `Level: ${manaliJan.level}, Reason: "${manaliJan.reason}", Alternatives: ${manaliJan.alternatives.join(', ')}`
      );

      // Test 7: Phase 16 - Season Engine Off-Season
      const manaliNov = await getSeason('manali', 11);
      assert(
        'Phase 16 Season Engine: Manali in Nov is Off-Season (low demand)',
        manaliNov.level === 'low' && manaliNov.isOffSeason === true,
        `Level: ${manaliNov.level}, Reason: "${manaliNov.reason}"`
      );

      // Test 8: Phase 16 - 12-Month Demand Bar rendering
      const barHtml = render12MonthDemandBar(manaliJan.allMonths, 1);
      assert(
        'Phase 16 UI: 12-Month Demand Bar contains all 12 months with accessible labels',
        barHtml.includes('season-demand-bars') && (barHtml.match(/season-month-col/g) || []).length === 12,
        `12 month columns correctly generated in bar component`
      );

      // Test 9: Safety SOS Profile & Health Details Storage
      store.setUserProfile({ name: 'Ramesh Sharma', age: 62, gender: 'Male', phone: '+91 98765 43210' });
      store.setEmergencyContacts([
        { name: 'Ananya Sharma', relationship: 'Daughter', phone: '+91 91234 56789', isPrimary: true },
        { name: 'Vikram Sharma', relationship: 'Son', phone: '+91 98765 22222', isPrimary: false },
        { name: 'Dr. K. Patel', relationship: 'Doctor', phone: '+91 98765 11111', isPrimary: false }
      ]);
      store.setHealthDetails({
        bloodGroup: 'B+',
        conditions: ['Hypertension (High BP)', 'Diabetes'],
        allergies: 'Penicillin',
        medications: 'Amlodipine 5mg morning, Metformin 500mg',
        mobility: 'Ground floor room required',
        doctorName: 'Dr. K. Patel',
        doctorPhone: '+91 98765 11111',
        criticalNotes: 'Carry insulin in front backpack pouch'
      });
      const currentStore = store.get();
      assert(
        'SOS Health Emergency & Family Contacts Profile: User identity, family members, and medical details correctly persisted in store',
        currentStore.userProfile.name === 'Ramesh Sharma' &&
        currentStore.emergencyContacts.length === 3 &&
        currentStore.emergencyContacts[0].relationship === 'Daughter' &&
        currentStore.emergencyContacts[0].isPrimary === true &&
        currentStore.healthDetails.bloodGroup === 'B+' &&
        currentStore.healthDetails.allergies === 'Penicillin' &&
        currentStore.healthDetails.doctorName === 'Dr. K. Patel',
        `Traveller: ${currentStore.userProfile.name}, Primary: ${currentStore.emergencyContacts[0].name} (${currentStore.emergencyContacts[0].relationship}), Blood: ${currentStore.healthDetails.bloodGroup}, Allergies: ${currentStore.healthDetails.allergies}`
      );

      // Test 10: Phase 17 - Curated destination search returns 6 pilot regions with isCurated: true
      const curatedList = await getCuratedDestinations();
      assert(
        'Phase 17 Curated Places: Loads all 6 pilot destinations with isCurated: true and placeKey format',
        curatedList.length === 6 && curatedList.every(c => c.isCurated === true && c.placeKey.startsWith('curated:')),
        `Loaded ${curatedList.length} curated destinations (${curatedList.map(c => c.name).join(', ')})`
      );

      // Test 11: Phase 17 - Search query matches curated instant lookup
      const searchMatches = await searchPlacesIndia('Manali');
      assert(
        'Phase 17 India Search: Matches local curated destination instantly',
        searchMatches.length > 0 && searchMatches[0].name === 'Manali' && searchMatches[0].isCurated === true,
        `Matched: ${searchMatches[0]?.name} (${searchMatches[0]?.placeKey})`
      );

      // Test 12: Phase 17 - Itinerary generation for non-curated place object strictly uses candidateAttractions
      const customOsmPlace = {
        placeKey: 'osm:node:998877',
        name: 'Kedarnath',
        state: 'Uttarakhand',
        district: 'Rudraprayag',
        lat: 30.7346,
        lng: 79.0669,
        source: 'osm',
        isCurated: false
      };
      const candidateActs = [
        { id: 'osm-1', name: 'Kedarnath Temple Shrine', category: 'Spiritual/Pilgrimage', lat: 30.7346, lng: 79.0669 },
        { id: 'osm-2', name: 'Bhairavnath Temple Viewpoint', category: 'Scenic Viewpoint', lat: 30.7390, lng: 79.0710 }
      ];
      const osmPrefs = {
        destination: 'osm:node:998877',
        selectedPlace: customOsmPlace,
        candidateAttractions: candidateActs,
        budget: 25000,
        days: 2,
        travellers: 2,
        moods: ['Spiritual/Pilgrimage'],
        accessibility: {}
      };
      const osmPlan = generateItinerary(osmPrefs, destinations);
      const usedCandidateIds = osmPlan.days.every(d => d.activities.every(a => a.id.startsWith('osm-')));
      assert(
        'Phase 17 OSM Itinerary: Generated strictly using provided candidate attractions without hallucinating fake places',
        osmPlan.destination.isOsm === true && usedCandidateIds && osmPlan.whyThisPlan.includes('OpenStreetMap'),
        `Destination: ${osmPlan.destination.name}, Activities: ${osmPlan.days[0].activities.map(a => a.name).join(', ')}`
      );

      // Test 13: 7-Day Weather Forecasting WMO Interpretation
      const clearSky = interpretWeatherCode(0);
      const heavyRain = interpretWeatherCode(65);
      const snowfall = interpretWeatherCode(71);
      const thunderstorm = interpretWeatherCode(95);
      assert(
        'Weather Code Interpreter: Maps WMO codes to correct condition labels and icons',
        clearSky.icon === '☀️' && heavyRain.icon === '🌧️' && snowfall.icon === '❄️' && thunderstorm.icon === '⛈️',
        `Clear: ${clearSky.icon} ${clearSky.label}, Rain: ${heavyRain.icon} ${heavyRain.label}, Snow: ${snowfall.icon} ${snowfall.label}, Storm: ${thunderstorm.icon} ${thunderstorm.label}`
      );

      // Test 14: 7-Day Day-by-Day Forecast Grid Generator
      const sample7DayForecast = [
        { date: '2026-10-24', dayName: 'Sat', weatherCode: 0, label: 'Clear Sky', icon: '☀️', tempMax: 24, tempMin: 12, precipProb: 5, windMax: 10 },
        { date: '2026-10-25', dayName: 'Sun', weatherCode: 1, label: 'Partly Cloudy', icon: '⛅', tempMax: 23, tempMin: 11, precipProb: 15, windMax: 12 },
        { date: '2026-10-26', dayName: 'Mon', weatherCode: 61, label: 'Rain', icon: '🌧️', tempMax: 19, tempMin: 10, precipProb: 65, windMax: 18 },
        { date: '2026-10-27', dayName: 'Tue', weatherCode: 0, label: 'Clear Sky', icon: '☀️', tempMax: 21, tempMin: 9, precipProb: 10, windMax: 8 },
        { date: '2026-10-28', dayName: 'Wed', weatherCode: 1, label: 'Partly Cloudy', icon: '⛅', tempMax: 22, tempMin: 10, precipProb: 20, windMax: 9 },
        { date: '2026-10-29', dayName: 'Thu', weatherCode: 2, label: 'Partly Cloudy', icon: '⛅', tempMax: 22, tempMin: 11, precipProb: 25, windMax: 11 },
        { date: '2026-10-30', dayName: 'Fri', weatherCode: 0, label: 'Clear Sky', icon: '☀️', tempMax: 25, tempMin: 13, precipProb: 0, windMax: 7 }
      ];
      const gridHtmlEn = render7DayForecastGrid(sample7DayForecast, false);
      const gridHtmlHi = render7DayForecastGrid(sample7DayForecast, true);
      const cardCount = (gridHtmlEn.match(/class="weather-day-card/g) || []).length;
      assert(
        '7-Day Weather Grid: Correctly generates 7 day cards with min/max temperatures, rain pills, and bilingual support',
        cardCount === 7 && gridHtmlEn.includes('Today') && gridHtmlHi.includes('आज') && gridHtmlEn.includes('24°') && gridHtmlEn.includes('65%'),
        `Rendered ${cardCount} cards. Contains Today / आज and 7 daily weather cards.`
      );
    }

    runTests();
  </script>
</body>
</html>
